<!DOCTYPE html>
<html lang="fr">
<head>
  <!--
    Adresse de base du site (remplacée par --base-href de `flutter build web`).
    La version web est publiée à la racine de https://biopole.github.io/.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Biopole Connect — demandes de congés et d'autorisations des collaborateurs Biopole.">
  <meta name="theme-color" content="#B40C18">

  <!-- iPhone : installation sur l'écran d'accueil (plein écran, nom, icône) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Biopole Connect">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Biopole Connect</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* Écran affiché pendant le chargement de l'application */
    html, body { margin: 0; height: 100%; background: #F6F6F7; }
    #chargement {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #77787B; font-size: 14px; letter-spacing: .2em;
    }
    #chargement img { width: 96px; height: 96px; border-radius: 22px; }
  </style>
</head>
<body>
  <div id="chargement">
    <img src="icons/Icon-192.png" alt="Biopole">
    <span>CONNECT</span>
  </div>
  <script>
    // Retire l'écran de chargement quand Flutter a affiché la première image
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('chargement');
      if (el) el.remove();
    });
  </script>
  <script>
    // Mises à jour automatiques (plus besoin de ⌘⇧R) :
    // 1. Supprimer l'ancien service worker Flutter et son cache hors-ligne,
    //    qui resservaient l'ancienne version. Celui des notifications
    //    (firebase-messaging-sw.js) est conservé.
    (function () {
      if (!('serviceWorker' in navigator)) return;
      var ctrl = navigator.serviceWorker.controller;
      var controlled = !!ctrl && ctrl.scriptURL.indexOf('flutter_service_worker') !== -1;
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        var jobs = regs.filter(function (r) {
          var sw = r.active || r.waiting || r.installing;
          return sw && sw.scriptURL.indexOf('flutter_service_worker') !== -1;
        }).map(function (r) { return r.unregister(); });
        if (window.caches) {
          jobs.push(caches.keys().then(function (keys) {
            return Promise.all(keys.filter(function (k) {
              return k.indexOf('flutter') === 0;
            }).map(function (k) { return caches.delete(k); }));
          }));
        }
        return Promise.all(jobs);
      }).then(function () {
        // La page actuelle venait de l'ancien cache : recharger une fois.
        if (controlled && !sessionStorage.getItem('biopole-sw-nettoye')) {
          sessionStorage.setItem('biopole-sw-nettoye', '1');
          location.reload();
        }
      }).catch(function () {});
    })();

    // 2. Toujours charger la dernière version du script de démarrage.
    (function () {
      var s = document.createElement('script');
      s.src = 'flutter_bootstrap.js?t=' + Date.now();
      s.async = true;
      document.body.appendChild(s);
    })();
  </script>
</body>
</html>
